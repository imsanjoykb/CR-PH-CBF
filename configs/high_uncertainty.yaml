# Experiment Configuration
# ========================
# Default configuration for paper experiments

experiment:
  name: "high_uncertainty_baseline"
  seed: 42
  num_episodes: 20
  max_steps: 250

environment:
  type: "TwoLinkRobot"
  uncertainty_level: "high"
  parameters:
    payload_mass: 2.5      # +166% uncertainty
    friction_multiplier: 3.0
    external_force: 4.0
    dt: 0.01               # 100 Hz control
    
obstacle:
  center: [1.1, 0.4]
  radius: 0.35

controller:
  type: "pd"
  gains:
    kp: 15.0
    kd: 3.0
  torque_limits: [-25.0, 25.0]

cbf:
  gains:
    k1: 2.0
    k2: 2.0
  conformal:
    delta: 0.01           # 99% coverage
    beta: 0.05            # Adaptation rate
    window: 200           # Calibration window

model:
  architecture: "PHResNet"
  hidden_dim: 64
  activation: "tanh"
  training:
    iterations: 200
    learning_rate: 0.001
    batch_size: 1

evaluation:
  methods:
    - "unconstrained"
    - "nominal_cbf"
    - "conservative_robust"
    - "cr_ph_cbf"
  
logging:
  save_trajectories: false
  save_interval: 10
  output_dir: "results/experiments"
